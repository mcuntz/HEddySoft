[version]
version = 0.9.0
date = 2026-09-12

[site]
# mostly used in output
site_id = FR-Hes
latitude = 48.6742166667
# must be coherent with all input files
utc_offset = 1.

[dates]
# date range to process, ISO8601 format, both dates start and end dates included
start_date = 2025-09-20T103000
end_date =   2025-09-20T110000
# start_date = 2023-05-01T000000
# end_date = 2023-06-30T233000

[files]
# If file directories are not absolute pathes (i.e. starting with /)
#   they are assumed relative to base_dir, which itself has to be
#   an absolute path
# All directories can also be list/tuples of directories
# i.e. including ,
base_dir = /Users/cuntz/prog/github/HEddySoft/examples/FR-Hes/
# output directory
output_dir = output
# output file (in output directory)
output_file = heddysoft_output.csv

[sonic]
# sonic files - leave irga_dir empty to use sonic files for irga as well,
# that means sonic and irga data is in same file
dir = /Users/cuntz/data/inrae/hesse/BD_Hesse/Donnees_brutes/2025/Auto/SmartfluxNT/raw/
# filenames can use regular expression-like filename globbing
files = 20[0-9]*-??-??T??????_*.ghg
# files = [a-zA-Z][0-9]*.slt
# filename date format, as datetime format-codes
# use %% to escape the % sign because of interpolation of config files
# e.g. %%Y-%%m-%%dT%%H%%M%%S
file_date_format = %%Y-%%m-%%dT%%H%%M%%S
# date in filename is start of timestep (0) or end of timestep (1)
file_ftimestep = 0
# define file extension : ghg, slt(_eddysoft)
file_type = ghg
# lenght of input file in seconds
file_length = 1800
# column index of u, v, w, ts, flag (index starts at 0)
#   ghg, for example: 48, 49, 50, 51, 52
#   slt, for example: 0, 1, 2, 3
columns = 48, 49, 50, 51, 52
# column names used
#   ghg, must be: u, v, w, ts, sonic_flag
#   slt, must be: u, v, w, ts  or u, v, w, sos
names = 'u', 'v', 'w', 'ts', 'sonic_flag'
# sonic type, for wind direction computation: R2Spar, R3Spar, HS50Spar
# assumes that R3 and HS50 does have internal crosswind correction,
# while R2 does not
sonic_type = HS50Spar
# sonic orientation, for wind direction computation: in degrees North
# instr_1_north_offset of EddyPro metadata
orientation = 315
# sampling rate, per second (e.g. 50 if at 50 Hz)
sampling_rate = 20
# sensor height, in meters above displacement height
# sensr height = 30.75, canopy height = 21.32, nStem = 1613,
#   -> displacement height = 15.77
sensor_height = 15.77
# plausibility limits as in Mauder et al. (AFM 2013)
u_lim = -50, 50
v_lim = -50, 50
w_lim = -10, 10
ts_lim = -20, 50

[irga]
# irga files - leave sonic_dir empty to use sonic files for irga as well,
# that means sonic and irga data are in same file;
# irga_files and irga_file_type are ignored then
dir =
# filenames can use regular expression-like filename globbing
files = '20[0-9]*-??-??T??????_*.ghg'
# files = [a-zA-Z][0-9]*.slt
# filename date format, as datetime format-codes
# use %% to escape the % sign because of interpolation of config files
# e.g. %%Y-%%m-%%dT%%H%%M%%S
file_date_format = %%Y-%%m-%%dT%%H%%M%%S
# date in filename is start of timestep (0) or end of timestep (1)
file_ftimestep = 0
# only ghg currently and slt from O Kolle's EddySoft (EddyMeas)
file_type = ghg
# irga type: Li6262, Li7200, Li7500rs
irga_type = Li7200rs
# column index of CO2, H2O, quality flag (index starts at 0)
#   ghg, for example: 26, 28, 4
#   slt, for example: 4, 5
columns = 26, 28, 4
# column names used
#   ghg, must be: CO2_dry, H2O_dry, irga_flag
#   slt, must be: CO2_wet, H2O_wet
names = 'CO2_dry', 'H2O_dry', 'irga_flag'
# CO2 and H2O calibration: CO2 = gain * obs + offset
# gain (ppm mV-1), offset (ppm)
co2_gain = 0.06
co2_offset = 300
# gain (mmol mol-1 mV-1), offset (mmol mol-1)
h2o_gain = 0.007
h2o_offset = 0.
# measurement type and unit
# mixing_ratio = dry_mixing_ratio,
# EddyPro uses mole_fraction for wet_mixing_ratio
# all four terms allowed for types; units not used (yet)
co2_type = wet_mixing_ratio
co2_unit = ppm
h2o_type = wet_mixing_ratio
h2o_unit = mmol mol-1
# plausibility limits as in Mauder et al. (AFM 2013)
co2_lim = 300, 1000
h2o_lim = 0, 45

[meteo]
# meteorological data files
dir = meteo
# filenames can use regular expression-like filename globbing
files = meteo_nt_2023.csv
# pandas.read_csv options (date_column will be used for index_col)
sep = ','
# use a %% to escape the % sign because of interpolation of config files,
# e.g. %%Y-%%m-%%d %%H:%%M:%%S
date_format = ISO8601
na_values = -9999
# datetime column name
date = TIMESTAMP_END
# pressure column name (hPa)
pressure = Pa_1_1_1 (Pa)
# air temperature column name (degC)
temperature = Ta_1_1_1 (K)
# air relative humiditiy column name (%)
relative_humidity = RH_1_1_1 (%%)

[timelag]
# max, eddypro, file
# max: extreme of lag, smoothed according to filter_length, within index window
#      [win_center - win_size, win_center + win_size]
# eddypro: max with default values from EddyPro timelag file
#          with relative humidity classes for H2O timelag
# file: read timelags for CO2 and H2O from file,
#       missing timelags in seconds will be linearily interpolated and
#       missing timelags indexes will be interpolated ny nearest neighbours
method = eddypro
#
# samples of window center and size for timelag method max
co2_center = -5
co2_size = 20
h2o_center = -5
h2o_size = 40
#
# smoothing filter length for timelag, used with methods max and eddypro
co2_filter_length = 2
h2o_filter_length = 2
#
# dir, files used with methods eddypro and file
# timelags file or EddyPro timelag config file
dir = timelag
# filenames can use regular expression-like filename globbing
files = 'nt_timelag.txt'
#
# all further options used with method file
# pandas.read_csv options (date_column will be used for index_col)
sep = ','
# use a %% to escape the % sign because of interpolation of config files
date_format = %%d/%%m/%%Y %%H:%%M
na_values = -9999
# datetime column name
date = time
# timelag column name for CO2
co2_timelag = co2
# timelag column name for H2O
h2o_timelag = h2o
# timelag given in seconds (True) or as index (False)
issecond = True

[spikes]
# 0 = no spikes handling,
# 1 = spike detection,
# 2 = spikes detection and replacement with linear interpolation
# 3 = spikes detection and replacement with mean
mode = 3
# method: vickers_mahrt_1997, mauder_et_al_2013
method = vickers_mahrt_1997
# Mauder et al. (2003)
z_mad = 7
# Vickers and Mahrt (1997)
# n for plausibility range (mean + n * sigma)
# suggested 5 for w and 3.5 for ts and IRGA
threshold_w = 5
threshold_ts = 3.5
threshold_irga = 3.5
# maximum number of consecutive outliers that can be considered as spikes
max_consecutive_spikes = 3

[rotation]
# tilt correction = rotation mode:
# 0: no rotation,
# 1: double rotation,
# 2: directional planar fit
mode = 2
# in case mode = 2, files. Otherwise, will not be used.
dir = planar_fit
# filenames can use regular expression-like filename globbing
files = nt_planar_fit_20230501000000.txt

[param]
# if True, multiprocessing mode - not implemented yet
multiprocessing = True
# threshold for completeness of input data (0.0 - 1.0)
data_complete = 0.9
# if True, perform instrument tests after Vitale et al. (2020)
# Test can be very slow. Setting it to False speeded up the run by 2.5 (3.8)
# for Bernard Heinesch
instrument_problems_tests = False
# if True, linear detrending is applied to temperature signal of sonic
detrend_temperature_signal = False
# if True, linear detrending is applied to CO2 and H2O signals
detrend_irga_signal = False
# number of logarithmically spaced frequency bins for cospectra
num_freq_bins = 50
# output lagged covariances - not implemented yet
write_cov = False

[plot]
# directory for diagnostic plots
dir = plot
spike_detection = False
instrument_problems_tests = False
cospectrum = False
covariance_peak = False
