[metadata]
name = HEddySoft
description = HEddySoft: An eddy covariance processing software
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/mcuntz/HEddySoft
author = Matthias Cuntz
author_email = mc@macu.de
maintainer = Matthias Cuntz
maintainer_email = mc@macu.de
license = MIT
license_files = LICEN[CS]E*, AUTHORS*
platforms = any
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Intended Audience :: End Users/Desktop
    Intended Audience :: Science/Research
    Natural Language :: English
    Operating System :: MacOS
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft
    Operating System :: Microsoft :: Windows
    Operating System :: POSIX
    Operating System :: Unix
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Atmospheric Science
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Software Development
    Topic :: Utilities
project_urls =
    Documentation = https://mcuntz.github.io/HEddySoft/
    Source = https://github.com/mcuntz/HEddySoft
    Tracker = https://github.com/mcuntz/HEddySoft/issues
    Changelog = https://github.com/mcuntz/HEddySoft/blob/main/CHANGELOG.rst
    Conda-Forge = https://anaconda.org/conda-forge/HEddySoft

[options]
packages = find:
package_dir =
    = src
install_requires =
    numpy
    pandas
    scipy
    matplotlib
    joblib
    diptest
    statsmodels
    typing-extensions
python_requires = >=3.8
zip_safe = False
include_package_data = False

[options.entry_points]
gui_scripts =
    heddysoft = heddysoft.__main__:main

[options.packages.find]
where = src
exclude =
    bin*
    tests*
    docs*

# [options.package_data]
# # include in any subpackage
# # * = *.png, *.ico
# # Include from subdirectories of src/include_package_data
# src/dfvue =
#     images/*.png
#     images/*.ico

[options.extras_require]
doc =
    numpydoc>=1.1,<2
    sphinx>=3,<4
    sphinx_book_theme>=1.0.1
test =
    coverage[toml]>=5.2.1,<6
    pytest>=6.0,<7
    pytest-cov>=2.11.0,<3
